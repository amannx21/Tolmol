# Default gitleaks rules, plus two narrow exceptions for public, non-secret values that the generic-api-key rule
# flags only because they sit next to the word "key":
#   - docs/seed-manifest.json is generated by scripts/seed.ts and holds only public on-chain data: entity keys,
#     creator addresses and transaction hashes, all visible on the explorer. It is still covered by
#     scripts/check-secrets.mjs (pre-commit), which compares every staged file against every local private key.
#   - localStorage key names such as "tolmol.prefs.v1".
# gitleaks 8.24 (the version CI uses) ORs paths and regexes in a global allowlist, so the hex pattern is NOT
# allowlisted by regex: a 0x-prefixed 64-hex value anywhere else in the repo is still reported.
[extend]
useDefault = true

[allowlist]
description = "Generated manifest of public entity keys; localStorage key names"
paths = ['''^docs/seed-manifest\.json$''']
regexes = ['''^tolmol\.[a-z.]+\.v[0-9]+$''']
