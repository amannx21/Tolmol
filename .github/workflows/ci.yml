# Lint, typecheck, unit tests, secret scan and required-files check on every push and PR.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w tolmol-sdk
      - run: npm run build -w tolmol-web
      - name: Required submission files
        run: |
          for f in LICENSE README.md arkiv/schema.md arkiv/friction.md arkiv/wallets.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          grep -q "MIT License" LICENSE
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
